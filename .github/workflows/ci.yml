name: Rust CI

on:
  push:
    branches: [ "main", "feat/*" ]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [ "main" ]

# Cancel in-progress runs of the same workflow on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint & Style
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - name: Cache
      uses: Swatinem/rust-cache@v2
    - name: Check formatting
      run: cargo fmt -- --check
    - name: Clippy
      run: |
        sudo apt-get install -y libssl-dev pkg-config
        cargo clippy --all-targets --features candle -- -D warnings

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache
      uses: Swatinem/rust-cache@v2
    - name: Run Tests
      run: |
        sudo apt-get install -y libssl-dev pkg-config
        cargo test --features candle

  check_llama:
    name: Llama Backend Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache
      uses: Swatinem/rust-cache@v2
    - name: Check Llama Feature
      run: |
        sudo apt-get install -y libssl-dev pkg-config cmake
        cargo check --features llama
