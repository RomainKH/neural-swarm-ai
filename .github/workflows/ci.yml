name: Rust CI

on:
  push:
    branches: [ "main", "feat/*" ]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"

env:
  CARGO_TERM_COLOR: always

jobs:
  check_and_test:
    name: Check and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libssl-dev pkg-config

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Run Clippy (Standard + Candle)
      run: cargo clippy --all-targets --features candle -- -D warnings

    - name: Build and Test (Standard + Candle)
      run: |
        cargo build --features candle
        cargo test --features candle

    - name: Check llama backend (Compilation only)
      run: cargo check --features llama
