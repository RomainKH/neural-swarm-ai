[package]
name = "neural-swarm-ai"
version = "0.1.0"
authors = ["Romain Khanoyan"]
edition = "2021"
description = "A lightweight Rust library for distributed LLM inference using Pipeline Parallelism."
license = "MIT"
repository = "https://github.com/RomainKH/neural-swarm-ai"
keywords = ["llm", "ai", "distributed", "p2p", "inference"]
categories = ["science", "network-programming"]

[dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
bytes = { version = "1.6", features = ["serde"] }
axum = { version = "0.8", features = ["ws"], optional = true }
tokio-tungstenite = { version = "0.26", optional = true }
tracing = "0.1"
anyhow = "1.0"
bincode = "1.3"
sysinfo = "0.33"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"

# Optional backends
llama-cpp-2 = { version = "0.1.146", optional = true }

[features]
default = ["server", "client"]
server = ["dep:axum"]
client = ["dep:tokio-tungstenite"]
llama = ["dep:llama-cpp-2"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
