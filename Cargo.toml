[package]
name = "neural-swarm-ai"
version = "0.4.0"
authors = ["Romain Khanoyan"]
edition = "2021"
description = "A lightweight Rust library for decentralized LLM inference using a Secure P2P Mesh."
license = "MIT"
repository = "https://github.com/RomainKH/neural-swarm-ai"
keywords = ["llm", "ai", "distributed", "p2p", "inference"]
categories = ["science", "network-programming"]

[dependencies]
# Core networking & async
libp2p = { version = "0.54", features = ["tokio", "noise", "yamux", "quic", "tcp", "dns", "identify", "ping", "kad", "serde"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
bytes = { version = "1.6", features = ["serde"] }
axum = { version = "0.8", features = ["ws"], optional = true }
tokio-tungstenite = { version = "0.26", optional = true, features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
anyhow = "1.0"
bincode = "1.3"
sysinfo = "0.33"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
zstd = "0.13"
aes-gcm = "0.10"
aead = "0.5"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
hkdf = "0.12"

# Optional backends
llama-cpp-2 = { version = "0.1.146", optional = true }
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }

[features]
default = ["server", "client"]
server = ["dep:axum"]
client = ["dep:tokio-tungstenite"]
llama = ["dep:llama-cpp-2"]
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers"]
metal = ["candle-core?/metal", "candle-nn?/metal"]
cuda = ["candle-core?/cuda", "candle-nn?/cuda"]
vulkan = []

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
